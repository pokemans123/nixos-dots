[osd]
background_opacity = 0.97999997809529305
offset_y = 24
position = "top_right"
scale = 1.300000011920929

[plugin_settings."ezequiel/mango_layouts"]
panel_open_near_click = true
panel_placement = "attached"

[plugin_settings."noctalia/screen_recorder"]
directory = ""
quality = "high"

[plugins]
enabled = [ "noctalia/screen_recorder", "ezequiel/mango_layouts", "thepunkoff/pomodoro" ]

[shell]
avatar_path = "/home/pranav/Pictures/Screenshots/pfp.png"
font_family = "JetBrainsMono NF"
polkit_agent = true
settings_show_advanced = true
time_format = "{:%-I:%M %p}"

    [shell.launcher]
    app_grid = true
    show_app_actions = false

    [shell.launcher.dmenu.entry.bookmarks]
    command = "printf 'Select Bookmark'"
    label="Bookmarks"
    prefix=""
    global = true
    glyph = "terminal"
    exec = "~/nixos-dots/config/scripts/rofimarks.sh"




    [shell.panel]
    open_near_click_wallpaper = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "hibernate"
    label = "Hibernate"
    shortcut = "6"
    variant = "default"

[theme]
builtin = "Tokyo-Night"
community_palette = "Mizuki-Akiyama"
custom_palette = "BlackEmber"
mode = "dark"
source = "community"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "emacs", "foot", "gtk3", "gtk4", "hyprland", "kitty", "mango" ]
    community_ids = [ "pywalfox", "discord", "vscode", "zed", "yazi" ]

[wallpaper]
directory = "/home/pranav/Pictures/wallpapers"
transition_duration = 3900

    [wallpaper.default]
    path = "/home/pranav/Pictures/wallpapers/mizuki/Mizuki-Akiyama-16.png"

    [wallpaper.last]
    path = "/home/pranav/Pictures/wallpapers/mizuki/Mizuki-Akiyama-16.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/pranav/Pictures/wallpapers/mizuki/Mizuki-Akiyama-16.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/pranav/Pictures/wallpapers/mizuki/Mizuki-Akiyama-16.png"

[weather]
refresh_minutes = 15
unit = "imperial"

[widget.Projects]
custom_image = "/etc/profiles/per-user/pranav/share/icons/candy-icons/apps/scalable/emacs.svg"
tooltip = "Open up projects in Doom Emacs"
type = "custom_button"

    [widget.Projects.actions]
    left = "exec ~/nixos-dots/emacs-projects.sh"

[widget.battery]
scale = 1.25

[widget.btn]
custom_color = "primary"
type = "ezequiel/mango_layouts:btn"

[widget.clock]
format = "{:%-I:%M %p}"
scale = 1.25
tooltip_format = "{:%A, %m.%d.%Y }"

[widget.configure_system]
custom_image = "/run/current-system/sw/share/icons/hicolor/48x48/apps/nix-snowflake.png"
tooltip = "Open up NixOS configuration"
type = "custom_button"

    [widget.configure_system.actions]
    left = "exec emacsclient -c --eval '(dired \"~/nixos-dots\")'"

[widget.control-center]
custom_image = "/run/current-system/sw/share/icons/hicolor/64x64/apps/nix-snowflake.png"
glyph = "snowflake"
scale = 1.25

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true

[widget.network]
show_vpn_label = true

[widget.privacy]
enabled = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.recorder_2]
type = "noctalia/screen_recorder:recorder"

[widget.session]
color = "error"

[widget.tray]
color = "error"
drawer = true

[widget.widget]
type = "thepunkoff/pomodoro:widget"

[widget.workspaces]
active_pill_size = 2.0499999999999998
capsule_opacity = 0.25
capsule_radius = 19
color = "secondary"
empty_color = "on_tertiary"
icon_color = "primary"
scale = 1.6000000000000001
show_labels = false

[widget.zen]
custom_image = "/etc/profiles/per-user/pranav/share/icons/candy-icons/apps/scalable/zen.svg"
tooltip = "Launch Zen Browser"
type = "custom_button"

    [widget.zen.actions]
    left = "exec zen"
