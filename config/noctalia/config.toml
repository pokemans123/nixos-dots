config_version = 12

[backdrop]
blur_intensity = 0.62999998591840267
enabled = true

[bar]
order = [ "island", "dock", "minimal" ]

    [bar.dock]
    auto_hide = true
    background_opacity = 0.68999998457729816
    center = [ "wallpaper", "Projects", "configure_system", "zen", "btn" ]
    enabled = true
    end = [ "clipboard" ]
    font_family = "JetBrainsMono NF"
