background_opacity = 0.75999998301267624
enabled = true
inactive_opacity = 0.99999997764825821
launcher_position = "start"
magnification_scale = 1.3000000044703484
pinned = [ "zen" ]
radius = 47
reserve_space = false
shadow = false
show_dots = true
smart_auto_hide = true

[hooks]
wallpaper_changed = "echo $(noctalia msg wallpaper-get) > ~/nixos-dots/config/.wallpaper"

[hot_corners]
enabled = true

    [hot_corners.bottom_right]
    action = "command"
    command = "~/nixos-dots/config/scripts/menu.sh"

    [hot_corners.top_right]
    action = "command"
    command = "mmsg dispatch toggle_named_scratchpad,scratchterm,none,foot --app-id scratchterm"

[keybinds]
validate = [ "Return", "KP_Enter", "space" ]

[location]
