# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=0
blur_params_hsplit=1
blur_params_num_passes=2
dwindle_vsplit=1
dwindle_preserve_split=0
focused_opacity=0.9
unfocused_opacity=0.8

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
ov_no_resize=1
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=35
repeat_delay=200
numlockon=1
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

#autostart
exec-once=~/nixos-dots/config/mango/autostart.sh
# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=1
gappov=1
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff
border_radius=5

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:vertical_scroller,monitor_name:HDMI-A-1
tagrule=id:3,layout_name:vertical_scroller
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=Alt,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER+ALT,l,spawn,noctalia msg session lock
bind=SUPER,Return,spawn,foot
bind=SUPER,b,spawn,librewolf
bind=SUPER+SHIFT,b,spawn,~/nixos-dots/config/scripts/rofimarks.sh
bind=SUPER+SHIFT,s,spawn, /run/current-system/sw/bin/screenshot
bind=SUPER,e,spawn,nautilus
bind=SUPER,w,spawn,noctalia msg panel-toggle wallpaper
bind=Ctrl+Alt,delete,spawn,noctalia msg panel-toggle session
bind=SUPER,s,spawn,noctalia msg settings-toggle
bind=SUPER,d,spawn,noctalia msg panel-toggle control-center
bind=SUPER,c,spawn, ~/nixos-dots/config/scripts/captures.sh
bind=SUPER+SHIFT,c,spawn, ~/nixos-dots/config/scripts/capture-notes.sh
bind=Ctrl,d,spawn, ~/nixos-dots/config/scripts/define.sh
bind=SUPER+SHIFT,w,spawn,rofi -show window

# exit
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down


# swap window
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
# bind=ALT,Tab,togglejump,
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverview
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,0,spawn,~/nixos-dots/config/scripts/comboview.sh



# scroller layout
bind=ALT,e,set_proportion,1.0
# bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+Alt,1,tag,1,0
bind=SUPER+Alt,2,tag,2,0
bind=SUPER+Alt,3,tag,3,0
bind=SUPER+Alt,4,tag,4,0
bind=SUPER+Alt,5,tag,5,0
bind=SUPER+Alt,6,tag,6,0
bind=SUPER+Alt,7,tag,7,0
bind=SUPER+Alt,8,tag,8,0
bind=SUPER+Alt,9,tag,9,0

bind=Alt+SHIFT,1,tag,1,1
bind=Alt+SHIFT,2,tag,2,1
bind=Alt+SHIFT,3,tag,3,1
bind=Alt+SHIFT,4,tag,4,1
bind=Alt+SHIFT,5,tag,5,1
bind=Alt+SHIFT,6,tag,6,1
bind=Alt+SHIFT,7,tag,7,1
bind=Alt+SHIFT,8,tag,8,1
bind=Alt+SHIFT,9,tag,9,1


# monitor switch
bind=alt+shift,h,focusmon,left
bind=alt+shift,l,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0


# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER+SHIFT,UP,focusstack,prev
axisbind=SUPER+SHIFT,DOWN,focusstack,next


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi


layerrule=animation_type_open:zoom,layer_name:noctalia-panel
layerrule=animation_type_close:zoom,layer_name:noctalia-panel
layerrule=noblur:0,layer_name:noctalia-attached-panel

# Window Rules
windowrule=appid:dev.noctalia.Noctalia,isfloating:1
windowrule=appid:com.gabm.satty,isfloating:1,animation_type:slide
windowrule=title:org-capture,isfloating:1
windowrule=isnamedscratchpad:1,width:1697,height:1144,appid:music
windowrule=isnamedscratchpad:1,width:1697,height:1144,appid:scratchterm
windowrule=appid:helium,focused_opacity:0.9

# bind=MOD,KEY,toggle_named_scratchpad,appid,title,command
bind=SUPER,XF86AudioPlay,toggle_named_scratchpad,music,none,foot --app-id music -e rmpc
bind=SUPER,t,toggle_named_scratchpad,scratchterm,none,foot --app-id scratchterm

# Setup window rules for applications
# Tag 1 for emacs
# Tag 2 for web browsing
# Tag 3 for communications
#
windowrule=appid:librewolf,tags:2
windowrule=appid:zen,tags:6
# windowrule=appid:[Ee]macs,tags:1
windowrule=appid:vesktop,tags:3
windowrule=appid:thunderbird,tags:3
windowrule=appid:mpv,tags:5|9
windowrule=appid:Tor Browser,tags:8
windowrule=appid:helium,tags:4


# Media keys
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +10%
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle


bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause

source=~/.config/mango/noctalia.conf

#Enter resize mode
bind=SUPER,r,setkeymode,resize

#Master Mode for Keybindings
bind=SUPER,x,setkeymode,master

keymode=master
bind=NONE,Escape,setkeymode,default
bind=NONE,1,comboview,1
bind=NONE,2,comboview,2
bind=NONE,3,comboview,3
bind=NONE,4,comboview,4
bind=NONE,5,comboview,5
bind=NONE,6,comboview,6
bind=NONE,7,comboview,7
bind=NONE,8,comboview,8
bind=NONE,9,comboview,9
bind=NONE,b,spawn,noctalia msg bar-toggle island
bind=SHIFT,b,spawn,noctalia msg bar-toggle minimal


keymode=resize
bind=NONE,f,togglefloating
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0
bind=NONE,Escape,setkeymode,default
